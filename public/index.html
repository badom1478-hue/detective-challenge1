<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>غرفة التحقيق | تحدي المحققين</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>🕵️ غرفة التحقيق</h1><p>عشر قضايا · سبعة أدلة لكل قضية · منافسة جماعية مباشرة</p><button id="sound">🔇 تشغيل المؤثرات</button></header><section id="entry" class="panel"><h2>ادخل المنافسة</h2><input id="team" placeholder="اسم فريق التحقيق" maxlength="32"><input id="code" placeholder="رمز الغرفة (للانضمام)" inputmode="numeric" maxlength="6"><div class="buttons"><button id="create">إنشاء غرفة</button><button id="join">الانضمام</button></div></section><section id="game" hidden><div class="panel"><div class="bar"><strong>رمز الغرفة: <span id="room"></span></strong><button id="copy">نسخ الرمز</button></div><p id="status"></p><button id="start" hidden>بدء التحقيق</button></div><div class="columns"><section class="panel"><h2 id="title"></h2><p id="story"></p><div id="clues"></div><h3>التلميحات المشروطة</h3><div id="hints"></div><h3>الاستنتاج النهائي</h3><p>بعد جمع الأدلة السبعة، اكتب اسم المشتبه به المسؤول.</p><input id="solution" placeholder="اسم المسؤول عن القضية"><button id="solve">تقديم الاستنتاج</button><button id="next" hidden>القضية التالية ←</button></section><aside class="panel"><h2>🏆 الترتيب المباشر</h2><div id="board"></div></aside></div></section><p id="message" role="status"></p><footer>ملاحظة: الغرف والنتائج مؤقتة وتُصفّر عند إعادة تشغيل الخادم.</footer></main><script src="/socket.io/socket.io.js"></script><script src="game.js"></script></body></html>
